services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_micro_task_board
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_micro_task_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./:/workspace:ro
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "until pg_isready -h db -U postgres -d go_micro_task_board; do sleep 1; done; psql -h db -U postgres -d go_micro_task_board -f /workspace/services/task-service/migrations/001_init_tasks.sql",
      ]

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth-service
    environment:
      TASKBOARD_HTTP_ADDR: ":8081"
      TASKBOARD_DB_URL: "postgres://postgres:postgres@db:5432/go_micro_task_board?sslmode=disable"
      TASKBOARD_JWT_SECRET: "dev-secret"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_started
    ports:
      - "8081:8081"

  task-service:
    build:
      context: .
      dockerfile: Dockerfile.task-service
    environment:
      TASKBOARD_HTTP_ADDR: ":8082"
      TASKBOARD_DB_URL: "postgres://postgres:postgres@db:5432/go_micro_task_board?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_started
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    environment:
      GATEWAY_ADDR: ":8080"
      AUTH_SERVICE_URL: "http://auth-service:8081/auth"
      TASK_SERVICE_URL: "http://task-service:8082/api"
    depends_on:
      auth-service:
        condition: service_started
      task-service:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  db-data:
